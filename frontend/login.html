<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Climate Action</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <header class="header">

        <a href="index.html" class="logo">
            🌱 Climate<span class="logo-highlight">Action</span>
        </a>

        <div class="header-buttons">
            <a href="signup.html" class="signup-button">Sign Up</a>
        </div>

    </header>


    <main class="auth-section">

        <div class="auth-box">

            <h2>Welcome Back</h2>

            <p>Login to track your carbon footprint.</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <button type="submit">Login</button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <a href="index.html" class="back-home-button">
                ← Back to Home
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
